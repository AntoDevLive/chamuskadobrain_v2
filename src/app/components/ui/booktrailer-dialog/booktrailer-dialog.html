<div class="relative w-full overflow-hidden rounded-2xl bg-black">

  <!-- Cerrar -->

<button type="button" (click)="close()" aria-label="Cerrar booktrailer"
  class="absolute right-3 top-3 z-20 flex h-10 w-10 cursor-pointer items-center justify-center rounded-full border border-white/40 bg-white/20 text-white shadow-lg backdrop-blur-md transition-all duration-300 hover:bg-white/30">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
    class="h-4 w-4">
    <path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6L6 18" />
  </svg>
</button>

  <!-- Vídeo -->

  <div class="aspect-video w-full">

    <iframe [src]="videoUrl" class="aspect-video h-auto w-full" title="Booktrailer"
      allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen>
    </iframe>

  </div>

</div>
